apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-daftar
  namespace: distributed-daftar
spec:
  replicas: 1

  selector:
    matchLabels:
      app: distributed-daftar

  template:
    metadata:
      labels:
        app: distributed-daftar
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis"; sleep 2; done

        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo "waiting for rabbitmq"; sleep 2; done

      containers:
        - name: distributed-daftar
          image: distributed-daftar:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: distributed-daftar-config

            - secretRef:
                name: distributed-daftar-secret

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
